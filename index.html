<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>3D ASCII-bukett</title>
<style>
  html, body { margin: 0; height: 100%; background: #10121c; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ============ Hjelpere ============
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const uni = (a, b) => a + (b - a) * rnd();
const norm = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/l, v[1]/l, v[2]/l]; };
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const add = (a, b, s = 1) => [a[0]+b[0]*s, a[1]+b[1]*s, a[2]+b[2]*s];
const mix = (a, b, t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
function basis(n) {
  const up = Math.abs(n[1]) < 0.95 ? [0,1,0] : [1,0,0];
  const u = norm(cross(n, up)); const w = norm(cross(n, u));
  return [u, w];
}

// Tegn-ramper (mørk -> lys) per materiale
const RAMP = {
  petal: ".:-=+*#%@",
  center: ".:oo0@@",
  leaf: ".:;=+%%%",
  stem: ".:|!|",
  paper: " .:-=-=",
  ribbon: ".:+*#%",
  dot: ".*o@"
};

// Punktlagring (flat array for fart)
const P = [];   // x,y,z, nx,ny,nz, r,g,b, rampId
const rampKeys = Object.keys(RAMP);
function pt(p, n, c, ramp) {
  P.push(p[0], p[1], p[2], n[0], n[1], n[2], c[0], c[1], c[2], rampKeys.indexOf(ramp));
}

// ============ Blomstertyper ============
const TYPES = {
  daisy:     { petals: 16, L: 0.30, W: 0.045, cup: 0.25, col: [250,250,250], tip: [255,240,245], center: [255,205,30], cR: 0.09 },
  sunflower: { petals: 20, L: 0.30, W: 0.06,  cup: 0.15, col: [255,200,20],  tip: [255,150,10],  center: [110,60,20],  cR: 0.14 },
  cosmos:    { petals: 8,  L: 0.30, W: 0.12,  cup: 0.30, col: [255,95,185],  tip: [255,170,220], center: [255,215,40], cR: 0.06 },
  aster:     { petals: 28, L: 0.25, W: 0.025, cup: 0.35, col: [150,80,240],  tip: [200,150,255], center: [255,210,50], cR: 0.07 },
  gerbera:   { petals: 22, L: 0.28, W: 0.045, cup: 0.20, col: [255,120,20],  tip: [255,180,60],  center: [90,40,10],   cR: 0.08 },
  tulip:     { tulip: true, col: [235,30,45], tip: [255,90,90] }
};

function petalFlower(c, n, t, size) {
  const [u, w] = basis(n);
  const L = t.L * size, W = t.W * size;
  const r0 = t.cR * size * 0.8;
  const twist = uni(0, Math.PI);
  for (let k = 0; k < t.petals; k++) {
    const a = twist + 2 * Math.PI * k / t.petals + uni(-0.05, 0.05);
    const dir = add([u[0]*Math.cos(a), u[1]*Math.cos(a), u[2]*Math.cos(a)], w, Math.sin(a));
    const perp = add([u[0]*-Math.sin(a), u[1]*-Math.sin(a), u[2]*-Math.sin(a)], w, Math.cos(a));
    const lenK = L * uni(0.9, 1.1);
    for (let i = 0; i <= 26; i++) {
      const s = i / 26;
      const width = W * Math.pow(Math.sin(Math.PI * (0.08 + 0.9 * s)), 0.7);
      const lift = t.cup * s * s * lenK - 0.05 * s * lenK;
      const col = mix(t.col, t.tip, s);
      for (let j = -4; j <= 4; j++) {
        const q = j / 4;
        let p = add(c, dir, r0 + s * lenK);
        p = add(p, perp, q * width);
        p = add(p, n, lift + 0.01 * k % 2);
        const nn = norm(add(n, dir, -t.cup * s * 1.5));
        pt(p, nn, mix(col, [0,0,0], Math.abs(q) * 0.25), "petal");
      }
    }
  }
  // Midten: kuppel med frømønster
  const R = t.cR * size;
  for (let i = 0; i < 260; i++) {
    const rr = R * Math.sqrt(i / 260), a = i * 2.39996; // gyllent snitt-spiral
    const h = R * 0.5 * (1 - (rr / R) ** 2);
    let p = add(add(c, u, rr * Math.cos(a)), w, rr * Math.sin(a));
    p = add(p, n, h + 0.01);
    const shade = 0.75 + 0.25 * Math.sin(i * 0.9);
    pt(p, norm(add(n, norm(add(u, w, 0)), 0)), t.center.map(v => v * shade), "center");
  }
}

function tulip(c, n, t, size) {
  const [u, w] = basis(n);
  const H = 0.40 * size;
  for (let i = 0; i < 90; i++) {
    const th = 2 * Math.PI * i / 90;
    const hmax = 0.82 + 0.18 * Math.abs(Math.cos(1.5 * th));
    for (let j = 0; j <= 34; j++) {
      const h = (j / 34) * hmax;
      const r = size * (0.17 * Math.sin(Math.PI * (0.18 + 0.72 * h)) + 0.015);
      const rad = add([u[0]*Math.cos(th), u[1]*Math.cos(th), u[2]*Math.cos(th)], w, Math.sin(th));
      const p = add(add(c, rad, r), n, h * H - 0.08 * size);
      const crease = 0.8 + 0.2 * Math.abs(Math.cos(1.5 * th));
      pt(p, norm(add(rad, n, -0.2)), mix(t.col, t.tip, h * 0.7).map(v => v * crease), "petal");
    }
  }
}

// ============ Scene ============
function buildScene() {
  const sphereC = [0, 0.35, 0], SR = 1.25;
  const heads = [];
  const N = 21;
  const order = ["daisy","tulip","cosmos","sunflower","aster","gerbera","daisy","cosmos","tulip","aster","sunflower"];
  for (let i = 0; i < N; i++) {
    // Fibonacci-fordeling på en kuppel
    const k = (i + 0.5) / N;
    const theta = Math.acos(1 - k * (1 - Math.cos(1.2)));
    const phi = i * 2.39996;
    const dir = [Math.sin(theta) * Math.cos(phi), Math.cos(theta), Math.sin(theta) * Math.sin(phi)];
    const r = SR * uni(0.95, 1.05);
    heads.push({ c: add(sphereC, dir, r), n: norm(add(dir, [0,1,0], 0.4)), type: order[i % order.length], size: uni(1.0, 1.25) });
  }

  // Stilker over papiret
  for (const h of heads) {
    const start = [h.c[0] * 0.18, 0.15, h.c[2] * 0.18];
    const end = add(h.c, h.n, -0.06);
    for (let i = 0; i <= 120; i++) {
      const s = i / 120;
      const bend = Math.sin(Math.PI * s) * 0.08;
      const p = [start[0] + (end[0]-start[0]) * s, start[1] + (end[1]-start[1]) * s + bend, start[2] + (end[2]-start[2]) * s];
      for (let a = 0; a < 4; a++) {
        const ang = a * Math.PI / 2;
        pt([p[0] + 0.012 * Math.cos(ang), p[1], p[2] + 0.012 * Math.sin(ang)], [Math.cos(ang), 0, Math.sin(ang)], [40,150,55], "stem");
      }
    }
    // Stilker under papiret
    for (let i = 0; i <= 50; i++) {
      const s = i / 50, y = -1.55 - s * 0.85;
      pt([h.c[0] * 0.09 * (1 + s * 0.3), y, h.c[2] * 0.09 * (1 + s * 0.3)], norm([h.c[0], 0, h.c[2]]), [50,170,60], "stem");
    }
  }

  // Blomster
  for (const h of heads) {
    const t = TYPES[h.type];
    if (t.tulip) tulip(h.c, h.n, t, h.size); else petalFlower(h.c, h.n, t, h.size);
  }

  // Små hvite "brudeslør"-prikker mellom blomstene
  for (let i = 0; i < 45; i++) {
    const th = uni(0, 1.25), ph = uni(0, 2 * Math.PI);
    const c = add(sphereC, [Math.sin(th) * Math.cos(ph), Math.cos(th), Math.sin(th) * Math.sin(ph)], SR * uni(0.9, 1.15));
    for (let j = 0; j < 14; j++) {
      const p = add(c, norm([uni(-1,1), uni(-1,1), uni(-1,1)]), uni(0, 0.06));
      pt(p, norm(add(p, sphereC, -1)), [255,255,255], "dot");
    }
  }

  // Store blader
  const LEAVES = 11;
  for (let k = 0; k < LEAVES; k++) {
    const a = 2 * Math.PI * k / LEAVES + uni(-0.2, 0.2);
    const out = [Math.cos(a), 0, Math.sin(a)];
    const base = [0.45 * out[0], uni(0.05, 0.3), 0.45 * out[2]];
    const d = norm([out[0], uni(0.25, 0.6), out[2]]);
    const side = norm(cross(d, [0,1,0]));
    const up = norm(cross(side, d));
    const len = uni(0.95, 1.25), wid = len * 0.26;
    for (let i = 0; i <= 45; i++) {
      const s = i / 45;
      const width = wid * Math.pow(Math.sin(Math.PI * s), 0.8);
      for (let j = -9; j <= 9; j++) {
        const q = j / 9;
        let p = add(base, d, s * len);
        p = add(p, side, q * width);
        p = add(p, [0,1,0], -0.45 * (s * len) ** 2 + 0.05 * Math.abs(q));  // henger ned + litt V-form
        const midrib = Math.abs(q) < 0.12;
        const col = midrib ? [150,230,140] : mix([40,170,60], [90,220,90], s);
        pt(p, norm(add(up, side, q * 0.6)), col, "leaf");
      }
    }
  }

  // Innpakningspapir (kjegle med folder og bølget kant)
  for (let i = 0; i < 220; i++) {
    const th = 2 * Math.PI * i / 220;
    const top = 0.25 + 0.18 * Math.sin(4 * th) + 0.06 * Math.sin(11 * th);
    for (let j = 0; j <= 90; j++) {
      const y = -1.6 + (j / 90) * 2.0;
      if (y > top) break;
      const f = (y + 1.6) / 1.85;
      const fold = 1 + 0.07 * Math.sin(9 * th);
      const R = (0.16 + f * 0.85) * fold;
      const nrm = norm([Math.cos(th) + 0.4 * Math.cos(9 * th) * Math.sin(th), 0.45, Math.sin(th)]);
      const shade = 0.85 + 0.15 * Math.sin(9 * th);
      const col = mix([235,220,228], [255,245,248], f).map(v => v * shade);
      pt([R * Math.cos(th), y, R * Math.sin(th)], nrm, col, "paper");
    }
  }

  // Sløyfe: bånd rundt + to løkker + to haler
  for (let i = 0; i < 200; i++) {
    const th = 2 * Math.PI * i / 200;
    for (let j = 0; j < 6; j++) {
      const y = -1.22 + j * 0.02;
      const R = (0.16 + ((y + 1.6) / 1.85) * 0.85) * 1.09;
      pt([R * Math.cos(th), y, R * Math.sin(th)], [Math.cos(th), 0, Math.sin(th)], [255,50,130], "ribbon");
    }
  }
  const knot = [0, -1.17, 0.42];
  for (const side of [-1, 1]) {
    for (let i = 0; i < 160; i++) {
      const a = 2 * Math.PI * i / 160;
      for (let j = 0; j < 5; j++) {
        const sc = 1 - j * 0.12;
        const p = [knot[0] + side * (0.18 + 0.17 * Math.cos(a)) * sc, knot[1] + 0.09 * Math.sin(a) * sc, knot[2] + 0.05];
        pt(p, [side * Math.cos(a) * 0.4, Math.sin(a) * 0.4, 1], [255,70,150], "ribbon");
      }
    }
    for (let i = 0; i <= 50; i++) {
      const s = i / 50;
      for (let j = -2; j <= 2; j++)
        pt([knot[0] + side * (0.03 + s * 0.12) + j * 0.01, knot[1] - s * 0.45, knot[2] + 0.06 + s * 0.04], [0,0,1], [240,40,120], "ribbon");
    }
  }
}
buildScene();
const PTS = new Float32Array(P);
const NP = PTS.length / 10;

// ============ Tegning ============
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const LIGHT = norm([-0.45, 0.65, 0.75]);
let W, H, CW, CH, cols, rows, S;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  CH = Math.max(6, Math.floor(H / 120));   // ~120 rader
  CW = CH * 0.62;
  cols = Math.floor(W / CW); rows = Math.floor(H / CH);
  S = Math.min(W / 3.6, H / 4.5);
  ctx.font = `bold ${CH + 1}px Menlo, Consolas, monospace`;
  ctx.textBaseline = "top";
}
addEventListener("resize", resize); resize();

let t0 = performance.now();
function frame(now) {
  const time = (now - t0) / 1000;
  const angle = time * 0.6;
  const tilt = 0.22 + 0.05 * Math.sin(time * 0.7);
  const n = cols * rows;
  const zb = new Float32Array(n).fill(-1e9);
  const chI = new Int16Array(n).fill(-1);
  const colR = new Uint8Array(n), colG = new Uint8Array(n), colB = new Uint8Array(n);
  const rampOf = new Int8Array(n);
  const ca = Math.cos(angle), sa = Math.sin(angle), ct = Math.cos(tilt), st = Math.sin(tilt);
  const dist = 6, cx = W / 2, cy = H / 2;
  const sway = 0.04 * Math.sin(time * 1.3);

  for (let k = 0; k < NP; k++) {
    const o = k * 10;
    let x = PTS[o], y = PTS[o+1], z = PTS[o+2];
    x += sway * Math.max(0, y);   // buketten svaier litt
    const x1 = x * ca + z * sa, z1 = -x * sa + z * ca;
    const y2 = y * ct - z1 * st, z2 = y * st + z1 * ct;
    const ooz = 1 / (dist - z2);
    const px = cx + x1 * S * ooz * dist;
    const py = cy - (y2 + 0.15) * S * ooz * dist;
    const sx = Math.floor(px / CW), sy = Math.floor(py / CH);
    if (sx < 0 || sx >= cols || sy < 0 || sy >= rows) continue;
    const i = sy * cols + sx;
    if (ooz <= zb[i]) continue;
    zb[i] = ooz;
    const nx = PTS[o+3], ny = PTS[o+4], nz = PTS[o+5];
    const nx1 = nx * ca + nz * sa, nz1 = -nx * sa + nz * ca;
    const ny2 = ny * ct - nz1 * st, nz2 = ny * st + nz1 * ct;
    let d = nx1 * LIGHT[0] + ny2 * LIGHT[1] + nz2 * LIGHT[2];
    d = Math.abs(d);
    const lum = Math.min(1, 0.25 + 0.75 * d);
    const depth = 0.75 + 0.25 * Math.min(1, Math.max(0, (z2 + 1.6) / 3.2)); // bakerste litt mørkere
    const L = lum * depth;
    colR[i] = PTS[o+6] * (0.62 + 0.38 * L);
    colG[i] = PTS[o+7] * (0.62 + 0.38 * L);
    colB[i] = PTS[o+8] * (0.62 + 0.38 * L);
    rampOf[i] = PTS[o+9];
    chI[i] = Math.round(L * 100);
  }

  ctx.fillStyle = "#10121c";
  ctx.fillRect(0, 0, W, H);

  // Grupper celler etter farge for rask tegning
  const groups = new Map();
  for (let i = 0; i < n; i++) {
    if (chI[i] < 0) continue;
    const key = ((colR[i] >> 3) << 10) | ((colG[i] >> 3) << 5) | (colB[i] >> 3);
    let g = groups.get(key);
    if (!g) groups.set(key, g = []);
    g.push(i);
  }
  for (const [key, list] of groups) {
    ctx.fillStyle = `rgb(${(key >> 10) << 3},${((key >> 5) & 31) << 3},${(key & 31) << 3})`;
    for (const i of list) {
      const ramp = RAMP[rampKeys[rampOf[i]]];
      const ch = ramp[Math.min(ramp.length - 1, Math.floor(chI[i] / 100 * ramp.length))];
      if (ch !== " ") ctx.fillText(ch, (i % cols) * CW, Math.floor(i / cols) * CH);
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
